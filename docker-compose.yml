# ==========================================
# FAQ API - Full Stack with Observability
# ==========================================

networks:
  faq-net:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

services:

  # ── Application ─────────────────────────
  faq-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: faq-api
    restart: unless-stopped
    ports:
      - "8080:8080"

    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      # IMPORTANT FIX → internal Kafka listener
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      APP_API_KEY: ${APP_API_KEY:-changeme-dev}

      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseZGC
        -Dspring.profiles.active=dev

    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - faq-net

  # ── Redis ───────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: faq-redis
    restart: unless-stopped

    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - faq-net

  # ── Zookeeper ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: faq-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    networks:
      - faq-net

  # ── Kafka ───────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: faq-kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Internal Docker communication
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      # External access from localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - faq-net

  # ── Prometheus ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: faq-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

    networks:
      - faq-net

  # ── Grafana ─────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: faq-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    networks:
      - faq-net

  # ── Kafka UI ────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: faq-kafka-ui
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - faq-net
